<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: orange;
            font-family: sans-serif;
        }
        dt > code {
            color: red;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>voce pode aplicar um estilo <em>embutido</em> para um elemento usando o atributo <code>style</code>.</p>
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>altera a cor texto do elemento</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>
</body>
</html>
